# Local ortam için isteğe bağlı log UI'ı (Seq). Başlatmak için: docker compose up -d
# UI: http://localhost:5341. Port yalnızca 127.0.0.1 üzerinde açıldığı için Seq'e sadece onu çalıştıran makineden erişilir:
# herkes kendi local makinesindeki Seq'e bağlanır, ağdaki başka bir makineden erişilemez. Authentication kapalıdır; bu yüzden paylaşımlı bir server'da kullanmayın.
services:
  seq:
    image: datalust/seq:latest
    container_name: seq-twostep-ddms
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - seq-data:/data

volumes:
  seq-data:
